<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a66c2">
<title>SignalPost — LinkedIn content, with a human pulse</title>
<style>
:root{--brand:#0a66c2;--brand2:#6d5dfc;--coral:#ff6b5f;--ink:#172033;--muted:#667085;--line:#e4e7ec;--bg:#f7f7f5;--card:#fff;--success:#059669;--warn:#d97706;--danger:#dc2626;--shadow:0 16px 40px rgba(23,32,51,.08);--radius:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}a{color:var(--brand)}:focus-visible{outline:3px solid rgba(10,102,194,.25);outline-offset:2px}
.app{min-height:100vh}.topbar{height:72px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--brand),var(--brand2));display:grid;place-items:center;box-shadow:0 8px 20px rgba(10,102,194,.22)}.brandmark:after{content:"";width:17px;height:13px;border:3px solid white;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);border-radius:2px}.brandname{font-size:20px;font-weight:800;letter-spacing:-.04em}.brandtag{color:var(--muted);font-size:12px}.user{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;background:#e7edf5;object-fit:cover}.shell{max-width:1500px;margin:auto;padding:26px 28px 54px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h1{font-size:30px;line-height:1.15;letter-spacing:-.04em;margin:0 0 7px}.hero p{margin:0;color:var(--muted)}
.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:11px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.16s ease}.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 20px rgba(23,32,51,.08)}.btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.success{background:var(--success);border-color:var(--success);color:white}.btn.danger{color:var(--danger)}.btn.ghost{background:transparent}.btn.small{padding:7px 10px;font-size:13px}.btn.wide{width:100%}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}.metric{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px;position:relative;overflow:hidden}.metric:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone,var(--brand))}.metric span{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}.metric b{display:block;font-size:27px;line-height:1.2;margin-top:5px}
.workspace{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,24,40,.02)}.composer{padding:20px;position:sticky;top:92px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.sectionhead h2{font-size:18px;margin:0;letter-spacing:-.02em}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);font-weight:800}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:800}.field small{color:var(--muted)}input,select,textarea{width:100%;border:1px solid #d7dce3;background:#fff;border-radius:10px;padding:10px 11px;color:var(--ink)}textarea{min-height:88px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#f1f3f6;border-radius:10px;padding:3px}.seg button{border:0;background:transparent;border-radius:8px;padding:8px;font-weight:800;color:var(--muted)}.seg button[aria-pressed=true]{background:white;color:var(--brand);box-shadow:0 2px 8px rgba(16,24,40,.08)}details.advanced{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}details.advanced summary{font-weight:800;color:var(--muted);cursor:pointer;margin-bottom:12px}
.maincol{display:grid;gap:18px}.review{padding:20px}.empty{padding:70px 20px;text-align:center}.emptyicon{width:58px;height:58px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(145deg,#e8f3ff,#eeeaff);display:grid;place-items:center;color:var(--brand);font-size:25px;font-weight:900}.empty h3{margin:0 0 6px}.empty p{margin:0;color:var(--muted)}.reviewgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.78fr);gap:16px}.editorpanel,.previewpanel{border:1px solid var(--line);border-radius:15px;padding:16px;background:#fff}.editorpanel textarea{min-height:315px;font-size:15px;line-height:1.7}.rtl{direction:rtl;text-align:right}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:#eef2f6;color:#475467}.status.draft{background:#eef2f6}.status.approved{background:#ecfdf3;color:#027a48}.status.scheduled{background:#fff7e8;color:#b54708}.status.publishing{background:#eff8ff;color:#175cd3}.status.published{background:#ecfdf3;color:#027a48}.status.failed{background:#fef3f2;color:#b42318}.counter{height:5px;background:#eef1f4;border-radius:5px;margin-top:9px;overflow:hidden}.counter i{display:block;height:100%;background:var(--brand);width:0}.counter.over i{background:var(--danger)}.counterline{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px}.linkedin{border:1px solid #d8dee6;border-radius:14px;padding:15px;background:white;box-shadow:0 8px 24px rgba(16,24,40,.06)}.lihead{display:flex;gap:10px;align-items:center;margin-bottom:12px}.liavatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(145deg,#dbeafe,#ddd6fe)}.liname{font-weight:800}.limeta{font-size:11px;color:var(--muted)}.litext{white-space:pre-wrap;line-height:1.55;overflow-wrap:anywhere}.liimage{margin-top:12px;width:100%;max-height:320px;object-fit:cover;border-radius:8px;background:#f2f4f7}.media{margin-top:14px;border:1px dashed #cfd6df;border-radius:12px;padding:12px;background:#fafbfc}.media img{width:100%;max-height:230px;object-fit:contain;border-radius:8px;margin-bottom:10px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.actions .spacer{flex:1}.schedule{display:flex;gap:7px;align-items:center}.schedule input{width:210px}.notice{padding:10px 12px;border-radius:10px;background:#fff7e8;color:#934b00;font-size:12px;margin-top:12px}.notice.error{background:#fef3f2;color:#b42318}
.queue{padding:20px}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.toolbar input{max-width:280px}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;border:1px solid var(--line);background:white;border-radius:12px;padding:13px;text-align:left;color:inherit}.row:hover{border-color:#b8c3d0;box-shadow:0 6px 16px rgba(16,24,40,.05)}.rowtitle{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowmeta{font-size:11px;color:var(--muted);margin-top:3px}.rowdate{font-size:11px;color:var(--muted)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 15%,#e6f2ff 0,transparent 35%),radial-gradient(circle at 85% 20%,#ede9ff 0,transparent 32%),var(--bg)}.gatecard{width:min(440px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.gatecard .brandmark{width:52px;height:52px;margin-bottom:20px}.gatecard h1{font-size:32px;letter-spacing:-.05em;margin:0 0 8px}.gatecard p{color:var(--muted)}.checks{display:grid;gap:8px;margin:22px 0;padding:16px 0;border-block:1px solid var(--line)}.check{display:flex;justify-content:space-between;font-size:13px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--success);margin-right:6px}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(10px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}.toast.bad{background:var(--danger)}
.app{background:#f5f7fb}.topbar{height:76px;padding:0 24px 0 26px;border-bottom-color:#e8edf4}.appframe{display:grid;grid-template-columns:238px minmax(0,1fr);max-width:1720px;margin:auto}.sidebar{min-height:calc(100vh - 76px);padding:24px 16px;border-right:1px solid #e5eaf1;background:rgba(255,255,255,.72);position:sticky;top:76px;height:calc(100vh - 76px);display:flex;flex-direction:column;gap:22px}.navgroup{display:grid;gap:5px}.navlabel{padding:0 11px 6px;color:#98a2b3;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.navitem{width:100%;border:0;background:transparent;color:#475467;border-radius:11px;padding:10px 11px;display:flex;align-items:center;gap:11px;text-align:left;font-weight:700}.navitem:hover,.navitem.active{background:#eaf3ff;color:#075eac}.navicon{width:22px;text-align:center;font-size:16px}.sidehealth{margin-top:auto;border:1px solid #dce7f4;background:linear-gradient(145deg,#f7fbff,#eef5ff);border-radius:15px;padding:14px}.sidehealth strong{display:block;font-size:13px;margin-bottom:5px}.sidehealth p{font-size:11px;color:var(--muted);margin:0 0 10px}.healthline{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;margin-top:6px}.healthdot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(5,150,105,.1)}.shell{max-width:none;margin:0;padding:28px 30px 60px;min-width:0}.hero{align-items:center;background:linear-gradient(115deg,#081b33 0%,#0b3965 65%,#0a66c2 100%);color:white;border-radius:22px;padding:26px 28px;box-shadow:0 18px 48px rgba(8,27,51,.14);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-65px;top:-110px;background:rgba(255,255,255,.08)}.hero .eyebrow{color:#8dc8ff}.hero p{color:#cbd8e8;max-width:650px}.hero h1{font-size:34px}.heroactions{display:flex;gap:9px;position:relative;z-index:1}.connectionpill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.11);padding:9px 12px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.connectionpill .healthdot{background:#42d392}.metrics{gap:14px}.metric{border:0;border-radius:17px;padding:18px 18px 16px;box-shadow:0 8px 26px rgba(18,38,63,.06)}.metric:before{left:18px;top:auto;bottom:0;width:42px;height:3px;border-radius:4px 4px 0 0}.metric span{font-size:11px}.metric b{font-size:30px;letter-spacing:-.04em}.metric:after{content:"posts";position:absolute;right:17px;bottom:17px;color:#b0b8c4;font-size:11px;font-weight:700}.card{border-color:#e6eaf0;box-shadow:0 8px 30px rgba(18,38,63,.045)}.composer{top:100px}.sectionhead h2{font-size:20px}.review{min-height:360px}.editorpanel,.previewpanel{background:#fbfcfe}.linkedin{box-shadow:0 12px 32px rgba(16,24,40,.08)}input,select,textarea{border-color:#d8dee8;transition:border-color .15s,box-shadow .15s}input:focus,select:focus,textarea:focus{border-color:#84b9eb;box-shadow:0 0 0 3px rgba(10,102,194,.09);outline:0}.productbadge{font-size:10px;font-weight:900;letter-spacing:.08em;background:#eef5ff;color:#075eac;border-radius:999px;padding:5px 8px}.topactions{display:flex;align-items:center;gap:10px}.topstatus{font-size:11px;color:#667085;display:flex;align-items:center;gap:7px;padding-right:5px}.empty{background:radial-gradient(circle at 50% 0,#f1f7ff,transparent 42%);border-radius:16px}
@media(max-width:1180px){.appframe{grid-template-columns:82px minmax(0,1fr)}.sidebar{padding-inline:12px}.navlabel,.navitem span:not(.navicon),.sidehealth{display:none}.navitem{justify-content:center}.navicon{font-size:18px}.workspace{grid-template-columns:minmax(300px,370px) minmax(0,1fr)}.reviewgrid{grid-template-columns:1fr}}
@media(max-width:900px){.appframe{display:block}.sidebar{display:none}.workspace{grid-template-columns:1fr}.composer{position:static}.metrics{grid-template-columns:repeat(3,1fr)}.hero{align-items:flex-start}.heroactions{margin-top:6px}}
@media(max-width:700px){.topbar{padding:0 14px;height:68px}.brandtag,.topstatus{display:none}.shell{padding:16px 12px 40px}.hero{padding:22px 20px;display:block}.hero h1{font-size:27px}.heroactions{margin-top:18px}.metrics{grid-template-columns:repeat(2,1fr)}.workspace{display:block}.composer,.review,.queue{margin-bottom:14px;padding:15px}.twocol{grid-template-columns:1fr}.actions{align-items:stretch}.actions .btn,.schedule{width:100%}.schedule input{width:100%}.row{grid-template-columns:minmax(0,1fr) auto}.rowdate{display:none}.user .username{display:none}.metric:last-child{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const MAX=3000, state={health:null,user:null,topics:[],posts:[],current:null,lang:'English',busy:false,filter:'all',search:''};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const el=id=>document.getElementById(id);
function toast(message,bad=false){const n=el('toast');n.textContent=message;n.className='toast show'+(bad?' bad':'');clearTimeout(n._t);n._t=setTimeout(()=>n.className='toast',3600)}
async function api(path,options={}){const r=await fetch(path,{method:options.method,headers:{'Content-Type':'application/json'},body:options.body?JSON.stringify(options.body):undefined});if(r.status===401){state.user=null;render();throw new Error('Your session ended. Sign in again.')}const d=await r.json().catch(()=>({ok:false,error:'The server returned an unreadable response.'}));if(!r.ok||d.ok===false)throw new Error(d.error||'Request failed.');return d}
function metric(label,status,color){return `<div class="metric" style="--tone:${color}"><span>${label}</span><b>${state.posts.filter(p=>status.includes(p.status)).length}</b></div>`}
function gate(){const h=state.health||{};return `<main class="gate"><section class="gatecard"><div class="brandmark" aria-hidden="true"></div><h1>SignalPost</h1><p>LinkedIn content with an AI engine—and a human pulse.</p><div class="checks"><div class="check"><span>Content engine</span><b>${h.openaiConfigured?'OpenAI ready':'Setup needed'}</b></div><div class="check"><span>Durable storage</span><b><i class="dot"></i>${h.durable?'Connected':'Local'}</b></div><div class="check"><span>Publishing</span><b>${h.linkedinConfigured?'LinkedIn connected':'Owner controlled'}</b></div></div><button class="btn primary wide" id="signin">Continue with GitHub</button><p style="font-size:12px;text-align:center">Nothing publishes without your explicit approval.</p></section></main>`}
function appView(){const connected=state.health.linkedinConfigured;return `<div class="app"><header class="topbar"><div class="brand"><div class="brandmark"></div><div><div class="brandname">SignalPost</div><div class="brandtag">AI drafts. Human judgment.</div></div></div><div class="topactions"><div class="topstatus"><i class="healthdot"></i>Systems operational</div><div class="user">${state.user.avatar?`<img class="avatar" src="${esc(state.user.avatar)}" alt="">`:'<div class="avatar"></div>'}<b class="username">${esc(state.user.login)}</b><button class="btn small" id="signout">Sign out</button></div></div></header><div class="appframe"><aside class="sidebar" aria-label="Dashboard navigation"><div class="navgroup"><div class="navlabel">Workspace</div><button class="navitem active" data-filter="all"><span class="navicon">⌂</span><span>Overview</span></button><button class="navitem" data-filter="draft"><span class="navicon">✎</span><span>Drafts</span></button><button class="navitem" data-filter="approved"><span class="navicon">✓</span><span>Approvals</span></button><button class="navitem" data-filter="scheduled"><span class="navicon">◷</span><span>Schedule</span></button><button class="navitem" data-filter="published"><span class="navicon">↗</span><span>Published</span></button></div><div class="navgroup"><div class="navlabel">Manage</div><div class="navitem"><span class="navicon">◫</span><span>Content pillars</span></div><div class="navitem"><span class="navicon">⚙</span><span>Settings</span></div></div><div class="sidehealth"><strong>Publishing stack</strong><p>Your production services are connected and ready.</p><div class="healthline"><i class="healthdot"></i>OpenAI ready</div><div class="healthline"><i class="healthdot"></i>Database ready</div><div class="healthline"><i class="healthdot"></i>${connected?'LinkedIn connected':'LinkedIn setup needed'}</div></div></aside><main class="shell"><div class="hero"><div><div class="eyebrow">Content command center</div><h1>Turn expertise into signal.</h1><p>Plan, draft, review, schedule, and publish LinkedIn content from one focused workspace.</p></div><div class="heroactions">${connected?'<span class="connectionpill"><i class="healthdot"></i>LinkedIn connected</span>':`<button class="btn" id="connect-li">Connect LinkedIn</button>`}</div></div><section class="metrics" aria-label="Content overview">${metric('Drafts',['draft'],'#0a66c2')}${metric('Awaiting approval',['approved'],'#6d5dfc')}${metric('Scheduled',['scheduled'],'#d97706')}${metric('Published',['published'],'#059669')}${metric('Failed',['failed'],'#dc2626')}</section><div class="workspace">${composer()}<div class="maincol">${review()}${queue()}</div></div></main></div></div>`}
function composer(){return `<aside class="card composer"><div class="sectionhead"><div><div class="eyebrow">Create post</div><h2>Start with the idea</h2></div><span>V3</span></div><div class="field"><label for="idea">Topic or idea</label><input id="idea" maxlength="300" placeholder="What should your network learn?"></div><div class="field"><label for="topic">Content pillar</label><select id="topic">${state.topics.map((t,i)=>`<option value="${i}">${esc(t.title)}</option>`).join('')}</select></div><div class="field"><label>Language</label><div class="seg"><button type="button" data-lang="en" aria-pressed="${state.lang==='English'}">English</button><button type="button" data-lang="ar" aria-pressed="${state.lang==='Arabic'}">العربية</button></div></div><div class="twocol"><div class="field"><label for="tone">Tone</label><select id="tone"><option value="authoritative and practical">Practical</option><option value="executive">Executive</option><option value="reflective">Reflective</option><option value="direct and technical">Technical</option></select></div><div class="field"><label for="objective">Objective</label><select id="objective"><option>Start a useful discussion</option><option>Share a practical lesson</option><option>Build thought leadership</option><option>Explain a complex idea</option></select></div></div><div class="field"><label for="audience">Target audience</label><input id="audience" placeholder="Technology leaders in Saudi Arabia"></div><details class="advanced"><summary>Sources, notes & call to action</summary><div class="field"><label for="source">Source URL <small>(optional)</small></label><input id="source" type="url" placeholder="https://..."></div><div class="field"><label for="notes">Supporting notes</label><textarea id="notes" placeholder="Facts, experience, or context the draft must preserve"></textarea></div><div class="field"><label for="cta">Call to action</label><input id="cta" placeholder="Ask readers to share their experience"></div></details><button class="btn primary wide" id="generate">Generate AI draft</button><p style="font-size:11px;color:var(--muted);margin:10px 0 0">Generation always creates a private draft. It never publishes.</p></aside>`}
function review(){if(!state.current)return `<section class="card review"><div class="empty"><div class="emptyicon">✦</div><h3>Your next post starts here</h3><p>Give SignalPost an idea, then shape the draft with your judgment.</p></div></section>`;const p=state.current,rtl=String(p.language).toLowerCase().startsWith('arab');const transforms=p.status==='draft'?`<div class="actions" aria-label="AI editing actions">${[['regenerate','Regenerate'],['shorten','Shorten'],['expand','Expand'],['tone','Change tone'],['translate',rtl?'Translate to English':'ترجمة للعربية']].map(([a,l])=>`<button class="btn small" data-transform="${a}">${l}</button>`).join('')}</div>`:'';return `<section class="card review"><div class="sectionhead"><div><div class="eyebrow">Review desk</div><h2>${esc(p.title)}</h2></div><span class="status ${esc(p.status)}">${esc(p.status)}</span></div><div class="reviewgrid"><div class="editorpanel"><div class="field"><label for="body">Post copy</label><textarea id="body" class="${rtl?'rtl':''}" dir="${rtl?'rtl':'ltr'}">${esc(p.text)}</textarea><div class="counter" id="counter"><i></i></div><div class="counterline"><span id="chars">0 characters</span><span>LinkedIn limit: ${MAX}</span></div></div>${transforms}<div class="media">${p.hasImage?`<img src="/api/posts/${encodeURIComponent(p.id)}/image?v=${encodeURIComponent(p.updatedAt)}" alt="${esc(p.imageAltText||'Attached post image')}">`:''}<div class="field"><label for="image-alt">Image alt text</label><input id="image-alt" maxlength="4086" value="${esc(p.imageAltText||'')}" placeholder="Describe the image for screen readers"></div><input id="image-file" type="file" accept="image/jpeg,image/png,image/gif" aria-label="Attach an image">${p.hasImage?'<button class="btn danger small" id="remove-image">Remove image</button>':''}</div>${p.error?`<div class="notice error">${esc(p.error)}</div>`:''}<div class="actions"><button class="btn" id="save">Save edits</button>${p.status==='draft'?'<button class="btn success" id="approve">Approve</button>':''}${p.status==='approved'?`<div class="schedule"><input id="when" type="datetime-local" aria-label="Publishing time"><button class="btn" id="schedule">Schedule</button></div><span class="spacer"></span><button class="btn primary" id="publish">Publish now</button>`:''}${p.status==='failed'?'<span class="spacer"></span><button class="btn primary" id="publish">Retry publish</button>':''}${p.linkedinUrl?`<a class="btn" target="_blank" rel="noopener" href="${esc(p.linkedinUrl)}">View on LinkedIn</a>`:''}<button class="btn danger small" id="remove">Delete</button></div>${p.status==='approved'?'<div class="notice">Approved content is locked for publishing. Editing the text or image returns it to Draft.</div>':''}</div><div class="previewpanel"><div class="eyebrow" style="margin-bottom:10px">Live preview</div><article class="linkedin"><div class="lihead"><div class="liavatar"></div><div><div class="liname">${esc(state.user.name||state.user.login)}</div><div class="limeta">Your professional headline · Now · 🌐</div></div></div><div class="litext ${rtl?'rtl':''}" dir="${rtl?'rtl':'ltr'}" id="preview-text">${esc(p.text)}</div>${p.hasImage?`<img class="liimage" src="/api/posts/${encodeURIComponent(p.id)}/image?v=${encodeURIComponent(p.updatedAt)}" alt="${esc(p.imageAltText||'')}">`:''}</article></div></div></section>`}
function queue(){const filtered=state.posts.filter(p=>(state.filter==='all'||p.status===state.filter)&&(`${p.title} ${p.text}`.toLowerCase().includes(state.search.toLowerCase())));return `<section class="card queue"><div class="sectionhead"><div><div class="eyebrow">Content queue</div><h2>Every post, one clear state</h2></div></div><div class="toolbar"><input id="search" type="search" placeholder="Search posts" value="${esc(state.search)}"><div class="filters">${['all','draft','approved','scheduled','published','failed'].map(f=>`<button class="filter ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div></div><div class="rows">${filtered.length?filtered.map(p=>`<button class="row" data-id="${esc(p.id)}"><div><div class="rowtitle">${esc(p.title)}</div><div class="rowmeta">${esc(p.language||'English')} · ${(p.text||'').length} chars${p.hasImage?' · Image':''}</div></div><span class="status ${esc(p.status)}">${esc(p.status)}</span><span class="rowdate">${esc(String(p.createdAt).slice(0,10))}</span></button>`).join(''):'<div class="empty" style="padding:30px"><p>No posts match this view.</p></div>'}</div></section>`}
function render(){document.documentElement.lang=state.lang==='Arabic'?'ar':'en';document.documentElement.dir=state.lang==='Arabic'?'rtl':'ltr';el('app').innerHTML=state.user?appView():gate();state.user?wireApp():wireGate()}
async function guard(node,work){if(state.busy)return;state.busy=true;const label=node?.textContent;if(node){node.disabled=true;if(node.tagName==='BUTTON')node.textContent='Working…'}try{await work()}catch(e){toast(e.message,true)}finally{state.busy=false;if(node&&document.body.contains(node)){node.disabled=false;if(node.tagName==='BUTTON')node.textContent=label}}}
function wireGate(){el('signin').onclick=e=>guard(e.currentTarget,async()=>{const {url}=await api('/auth/github');location.href=url})}
function wireApp(){el('signout').onclick=()=>guard(null,async()=>{await api('/auth/logout',{method:'POST'});state.user=null;state.current=null;render()});const cli=el('connect-li');if(cli)cli.onclick=e=>guard(e.currentTarget,async()=>{const {url}=await api('/auth/linkedin');location.href=url});document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang==='ar'?'Arabic':'English';render()});el('generate').onclick=e=>guard(e.currentTarget,async()=>{const {post}=await api('/api/posts/generate',{method:'POST',body:{topicIndex:Number(el('topic').value),idea:el('idea').value.trim()||undefined,language:state.lang,tone:el('tone').value,objective:el('objective').value,audience:el('audience').value.trim()||undefined,sourceUrl:el('source').value.trim()||undefined,notes:el('notes').value.trim()||undefined,cta:el('cta').value.trim()||undefined}});state.current=post;await refresh();toast('Draft ready for your review.')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});el('search').oninput=e=>{state.search=e.target.value;render()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state.current=state.posts.find(p=>p.id===b.dataset.id);render();scrollTo({top:0,behavior:'smooth'})});wireReview()}
function wireReview(){const body=el('body');if(!body)return;const paint=()=>{const n=body.value.length,c=el('counter');el('chars').textContent=`${n.toLocaleString()} characters`;c.querySelector('i').style.width=Math.min(100,n/MAX*100)+'%';c.className='counter'+(n>MAX?' over':'');el('preview-text').textContent=body.value};body.oninput=paint;paint();document.querySelectorAll('[data-transform]').forEach(button=>button.onclick=e=>guard(e.currentTarget,async()=>{const action=e.currentTarget.dataset.transform;let tone='';if(action==='tone')tone=prompt('Choose a tone: practical, executive, reflective, or technical','executive')||'';const language=action==='translate'?(String(state.current.language).toLowerCase().startsWith('arab')?'English':'Arabic'):state.current.language;const {post}=await api(`/api/posts/${encodeURIComponent(state.current.id)}/transform`,{method:'POST',body:{action,tone,language}});state.current=post;await refresh();toast('Draft updated. Review it before approval.') }));el('save').onclick=e=>guard(e.currentTarget,async()=>{const {post}=await api(`/api/posts/${encodeURIComponent(state.current.id)}`,{method:'PATCH',body:{text:body.value,imageAltText:el('image-alt').value}});state.current=post;await refresh();toast('Edits saved.')});const approve=el('approve');if(approve)approve.onclick=e=>guard(e.currentTarget,async()=>{if(body.value.length>MAX)throw new Error('Shorten the post before approval.');await api(`/api/posts/${encodeURIComponent(state.current.id)}`,{method:'PATCH',body:{text:body.value,imageAltText:el('image-alt').value}});const {post}=await api(`/api/posts/${encodeURIComponent(state.current.id)}/approve`,{method:'POST',body:{}});state.current=post;await refresh();toast('Approved. Ready to schedule or publish.')});const schedule=el('schedule');if(schedule)schedule.onclick=e=>guard(e.currentTarget,async()=>{if(!el('when').value)throw new Error('Choose a future date and time.');const {post}=await api(`/api/posts/${encodeURIComponent(state.current.id)}/schedule`,{method:'POST',body:{scheduledFor:new Date(el('when').value).toISOString()}});state.current=post;await refresh();toast('Scheduled safely.')});const publish=el('publish');if(publish)publish.onclick=e=>guard(e.currentTarget,async()=>{if(!confirm('Publish this approved post to LinkedIn now? This action is public and cannot be undone.'))return;const {post}=await api(`/api/posts/${encodeURIComponent(state.current.id)}/publish`,{method:'POST',body:{confirm:true}});state.current=post;await refresh();toast('Published to LinkedIn.')});el('remove').onclick=e=>guard(e.currentTarget,async()=>{if(!confirm('Delete this post permanently?'))return;await api(`/api/posts/${encodeURIComponent(state.current.id)}`,{method:'DELETE'});state.current=null;await refresh();toast('Post deleted.')});const file=el('image-file');file.onchange=()=>guard(file,async()=>{const f=file.files[0];if(!f)return;if(!['image/jpeg','image/png','image/gif'].includes(f.type))throw new Error('Choose a JPG, PNG, or GIF image.');if(f.size>20*1024*1024)throw new Error('Image must be 20 MB or smaller.');const r=await fetch(`/api/posts/${encodeURIComponent(state.current.id)}/image`,{method:'PUT',headers:{'Content-Type':f.type,'X-Image-Name':encodeURIComponent(f.name),'X-Image-Alt':encodeURIComponent(el('image-alt').value.trim())},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||'Image upload failed.');state.current=d.post;await refresh();toast('Image attached. Approval reset for review.')});const ri=el('remove-image');if(ri)ri.onclick=e=>guard(e.currentTarget,async()=>{const {post}=await api(`/api/posts/${encodeURIComponent(state.current.id)}/image`,{method:'DELETE'});state.current=post;await refresh();toast('Image removed.')})}
async function refresh(){const {posts}=await api('/api/posts');state.posts=posts;if(state.current)state.current=posts.find(p=>p.id===state.current.id)||state.current;render()}
async function boot(){try{state.health=await api('/api/health')}catch{}try{const me=await fetch('/auth/me').then(r=>r.json());state.user=me.user||null}catch{}if(state.user){try{const [t,p]=await Promise.all([api('/api/topics'),api('/api/posts')]);state.topics=t.topics;state.posts=p.posts;state.current=state.posts.find(x=>['draft','approved','failed'].includes(x.status))||null}catch(e){toast(e.message,true)}}render()}
boot();
</script></body></html>
