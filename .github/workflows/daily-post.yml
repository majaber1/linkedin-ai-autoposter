name: SignalPost Automation

on:
  schedule:
    - cron: '0 5 * * 0,2,4' # Drafts: Sun/Tue/Thu 08:00 Asia/Riyadh
    - cron: '*/15 * * * *'  # Publish approved, due schedules
    - cron: '0 6 * * 6'     # Weekly status: Saturday 09:00 Asia/Riyadh
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        type: choice
        options: [generate, publish-due, status]
        default: status

permissions:
  contents: read

jobs:
  call-signalpost:
    runs-on: ubuntu-latest
    steps:
      - name: Select safe automation operation
        id: operation
        env:
          MANUAL_OPERATION: ${{ inputs.operation }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$MANUAL_OPERATION" ]; then operation="$MANUAL_OPERATION"
          elif [ "$SCHEDULE" = "0 5 * * 0,2,4" ]; then operation="generate"
          elif [ "$SCHEDULE" = "*/15 * * * *" ]; then operation="publish-due"
          else operation="status"
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

      - name: Call authenticated production API
        env:
          SIGNALPOST_URL: ${{ secrets.SIGNALPOST_URL }}
          SIGNALPOST_KEY: ${{ secrets.AUTOMATION_API_KEY }}
          OPERATION: ${{ steps.operation.outputs.operation }}
        run: |
          test -n "$SIGNALPOST_URL" && test -n "$SIGNALPOST_KEY"
          if [ "$OPERATION" = "generate" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST "$SIGNALPOST_URL/api/automation/generate" \
              -H "x-api-key: $SIGNALPOST_KEY" -H "content-type: application/json" \
              --data '{"objective":"Share a practical lesson","audience":"Technology leaders in Saudi Arabia"}'
          elif [ "$OPERATION" = "publish-due" ]; then
            curl --fail-with-body --silent --show-error \
              -X POST "$SIGNALPOST_URL/api/automation/publish-due" \
              -H "x-api-key: $SIGNALPOST_KEY" -H "content-type: application/json" \
              --data '{"limit":10}'
          else
            curl --fail-with-body --silent --show-error \
              "$SIGNALPOST_URL/api/automation/pending" -H "x-api-key: $SIGNALPOST_KEY"
          fi
